name: karukan-fcitx5 CI

on:
  push:
    branches: [main]
    paths:
      - 'karukan-im/fcitx5/**'
      - 'karukan-im/core/**'
      - 'karukan-engine/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/karukan-fcitx5-ci.yml'
  # No `paths` filter here on purpose: a workflow skipped by path filtering
  # never creates its check runs, so required status checks stay stuck on
  # "Expected — Waiting for status to be reported" and block the merge. The
  # same paths live in the `changes` job below instead — a job skipped by
  # `if:` *does* report, and a skipped check satisfies a required check.
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Decides whether this crate's jobs need to run. On pull requests the
  # remaining jobs are skipped when nothing relevant changed — skipped checks
  # are reported and count as passing, which a path-filtered trigger cannot do.
  changes:
    name: Changes (karukan-fcitx5)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - 'karukan-im/fcitx5/**'
              - 'karukan-im/core/**'
              - 'karukan-engine/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/karukan-fcitx5-ci.yml'

  check:
    name: Check
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Run cargo check
        run: cargo check -p karukan-fcitx5 --all-targets

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Run cargo clippy
        run: cargo clippy -p karukan-fcitx5 --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Run cargo fmt
        run: cargo fmt -p karukan-fcitx5 -- --check

  test:
    # Qualified with the crate name: karukan-im CI has a `Test` job too, and
    # two identically named checks make the required status check ambiguous
    # about which one it refers to.
    name: Test (karukan-fcitx5)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Run tests
        run: cargo test -p karukan-fcitx5
