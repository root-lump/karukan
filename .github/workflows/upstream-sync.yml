name: Upstream Sync

on:
  schedule:
    - cron: '0 0 * * *'  # 毎日 UTC 0:00
  push:
    # main が進んだら upstream-sync を新しい main の上に作り直し、PR body も
    # 最新の main..master に合わせ直す。このワークフローが push するのは
    # master（API 経由）と upstream-sync だけなので、自己ループはしない。
    branches:
      - main
  workflow_dispatch:  # 手動実行も可能

permissions:
  contents: write
  pull-requests: write

# schedule と push が重なっても upstream-sync の force push と PR 更新が
# 競合しないよう直列化する
concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # fork リポジトリでは GITHUB_TOKEN で PR を作成できない
          # (Resource not accessible by integration) ため、fine-grained PAT を使う
          token: ${{ secrets.SYNC_PAT }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync master with upstream via GitHub API
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          gh api repos/${{ github.repository }}/merge-upstream -f branch=master

      - name: Fetch updated master
        run: |
          git fetch origin master main

      - name: Check for commits to sync from master
        id: check_diff
        run: |
          # fork の main には upstream に無い独自変更が常にあるため、ツリー差分
          # (git diff master main) は upstream が同期済みでも必ず非空になり、
          # 「マージしてもコミットが増えない」ケースを検出できない（PR 作成が
          # No commits between main and upstream-sync で失敗していた）。
          # 取り込むべきコミットの有無で判定し、基点は Build sync branch が
          # ブランチを作り直す土台 (origin/main) に合わせる。
          if [ "$(git rev-list --count origin/main..origin/master)" -eq 0 ]; then
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_diff=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect upstream PR titles from merge commits
        if: steps.check_diff.outputs.has_diff == 'true'
        id: collect_prs
        run: |
          # origin/main..origin/master 間のマージコミットから PR 情報を抽出（API 不要）
          # fork 元 PR への相互参照（mentioned 通知）を残さないよう、リンクは
          # redirect.github.com 経由にする（バックリンクを生成しない公式の方法:
          # docs.github.com の "Avoiding backlinks to linked references"）
          PR_LIST=""
          while IFS= read -r line; do
            if [ -n "$line" ]; then
              # subject から PR 番号を抽出、body から PR タイトルを取得
              PR_NUM=$(echo "$line" | grep -oP '(?<=#)\d+' | head -1)
              PR_TITLE=$(git log --format="%b" -1 "$(echo "$line" | cut -d' ' -f1)")
              if [ -n "$PR_NUM" ] && [ -n "$PR_TITLE" ]; then
                PR_LIST="${PR_LIST}- [#${PR_NUM}](https://redirect.github.com/togatoga/karukan/pull/${PR_NUM}) ${PR_TITLE}"$'\n'
              fi
            fi
          done < <(git log origin/main..origin/master --merges --oneline --grep="Merge pull request")

          # マージコミットが見つからない場合（squash merge 等）のフォールバック
          # subject 中の "(#N)" はそのままだと自リポジトリの PR として誤リンク
          # されるため、redirect.github.com 経由の upstream リンクに変換する
          if [ -z "$PR_LIST" ]; then
            TOTAL=$(git log origin/main..origin/master --oneline --no-merges | wc -l)
            PR_LIST="(マージコミットなし。コミット一覧:)"$'\n'
            while IFS= read -r line; do
              LINKED=$(echo "$line" | sed -E 's|#([0-9]+)|[#\1](https://redirect.github.com/togatoga/karukan/pull/\1)|g')
              PR_LIST="${PR_LIST}- ${LINKED}"$'\n'
            done < <(git log origin/main..origin/master --oneline --no-merges | head -20)
            # 一覧は 20 件で打ち切るため、隠れた分があることを明示する
            if [ "$TOTAL" -gt 20 ]; then
              PR_LIST="${PR_LIST}- ...他 $((TOTAL - 20)) 件"$'\n'
            fi
          fi

          # multiline output
          {
            echo "pr_list<<EOF"
            echo "$PR_LIST"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build sync branch
        if: steps.check_diff.outputs.has_diff == 'true'
        id: build_branch
        run: |
          # master はミラーなので PR の head にせず、main から作り直した
          # 専用ブランチに master をマージして常に main に追従させる
          git checkout -B upstream-sync origin/main
          if git merge --no-edit origin/master; then
            git push -f origin upstream-sync
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # コンフリクト時はマージ結果を push できない。PR が無いと Actions の
          # ログを見ないと気づけないので、衝突したファイルを PR body に載せて
          # 通知する。
          git diff --name-only --diff-filter=U > /tmp/conflicts.txt
          git merge --abort
          echo "conflict=true" >> "$GITHUB_OUTPUT"

          # GitHub は 0 コミットの PR を作れないため、upstream-sync が main と
          # 同一だと通知の受け皿が無い。その場合だけ origin/main + 空コミットで
          # 作り直して PR を作れるようにする。既に実コミットが載っている
          # upstream-sync（前回同期分や手動解消済みのマージ）は踏み潰さない。
          # merge --abort 済みなので HEAD は上の checkout -B が置いた origin/main。
          if [ "$(git rev-list --count origin/main..origin/upstream-sync 2>/dev/null || echo 0)" -eq 0 ]; then
            git commit --allow-empty -m "chore: upstream-sync コンフリクト通知用の空コミット"
            git push -f origin upstream-sync
          fi

          {
            echo "conflict_files<<EOF"
            cat /tmp/conflicts.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update PR
        if: steps.check_diff.outputs.has_diff == 'true'
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
          # fork リポジトリでは gh が fork 元 (togatoga/karukan) を PR の対象に
          # 解決してしまうため、自リポジトリに明示的に固定する
          GH_REPO: ${{ github.repository }}
          PR_ENTRIES: ${{ steps.collect_prs.outputs.pr_list }}
          CONFLICT: ${{ steps.build_branch.outputs.conflict }}
          CONFLICT_FILES: ${{ steps.build_branch.outputs.conflict_files }}
        run: |
          # コンフリクトしたときは、その事実と衝突ファイル・解消手順を body の
          # 先頭に出す。upstream-sync ブランチは更新できていないので、PR の
          # 差分は前回のままである点も含めて明記する。
          NOTICE=""
          if [ "$CONFLICT" = "true" ]; then
            FILE_LIST=$(echo "$CONFLICT_FILES" | sed '/^$/d' | sed 's|^|> - `|; s|$|`|')
            NOTICE="> [!WARNING]
          > **コンフリクトが発生しています。手動での解決が必要です。**
          >
          > \`main\` に \`master\` を自動マージできなかったため、\`upstream-sync\`
          > ブランチは更新されていません（この PR の差分は前回の同期時点のままです）。
          > 手元で解消してから force push してください。
          >
          > \`\`\`sh
          > git fetch origin
          > git checkout -B upstream-sync origin/main
          > git merge origin/master   # 衝突を解消してコミット
          > git push -f origin upstream-sync
          > \`\`\`
          >
          > 衝突したファイル:
          ${FILE_LIST}

          "
          fi

          # body は毎回 origin/main..origin/master から作り直す。
          # 以前は既存 body への追記方式だったが、origin/main..origin/master は
          # 「main に未取り込みの upstream コミット全部」を毎回返すため、
          # PR がマージされるまで同じコミットが日付セクションごとに再掲されていた。
          BODY="${NOTICE}## Upstream Changes

          upstream (togatoga/karukan) からの変更を main に取り込む PR です。

          ### 含まれる upstream PR

          ${PR_ENTRIES}"
          TITLE="upstream sync: $(date -u +%Y-%m-%d)"
          if [ "$CONFLICT" = "true" ]; then
            TITLE="$TITLE (コンフリクトあり)"
          fi

          EXISTING_PR=$(gh pr list --base main --head upstream-sync --state open --json number --jq '.[0].number' 2>/dev/null || echo "")

          # 通知できたかを output に出す。コンフリクトはジョブを失敗させないので、
          # 「通知そのものに失敗した」ケースだけは最後のステップで拾う必要がある。
          NOTIFIED=true
          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" --title "$TITLE" --body "$BODY" || NOTIFIED=false
          else
            gh pr create --base main --head upstream-sync \
              --title "$TITLE" --body "$BODY" || NOTIFIED=false
          fi
          echo "notified=$NOTIFIED" >> "$GITHUB_OUTPUT"

      - name: Report merge conflict
        if: steps.build_branch.outputs.conflict == 'true'
        env:
          CONFLICT_FILES: ${{ steps.build_branch.outputs.conflict_files }}
          NOTIFIED: ${{ steps.create_pr.outputs.notified }}
        run: |
          {
            echo "## upstream-sync: コンフリクト"
            echo
            echo "\`main\` に \`master\` をマージできませんでした。衝突したファイル:"
            echo
            echo "$CONFLICT_FILES" | sed '/^$/d' | sed 's|^|- `|; s|$|`|'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::main と master のマージがコンフリクトしました。upstream-sync を手動で解消してください。"

          # コンフリクト自体ではジョブを失敗させない。警告つきの PR が通知の
          # 役割を果たすため、毎日の失敗通知でコンフリクトが埋もれるのを避ける。
          # 通知にも失敗したときは誰も気づけないので、そのときだけ失敗させる。
          if [ "$NOTIFIED" != "true" ]; then
            echo "::error::コンフリクトを通知する PR を作成・更新できませんでした。"
            exit 1
          fi
