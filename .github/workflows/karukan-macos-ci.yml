name: karukan-macos CI

on:
  push:
    branches: [main]
    paths:
      - 'karukan-im/macos/**'
      - 'karukan-im/core/**'
      - 'karukan-engine/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/karukan-macos-ci.yml'
  # No `paths` filter here on purpose: a workflow skipped by path filtering
  # never creates its check runs, so required status checks stay stuck on
  # "Expected — Waiting for status to be reported" and block the merge. The
  # same paths live in the `changes` job below instead — a job skipped by
  # `if:` *does* report, and a skipped check satisfies a required check.
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Decides whether this frontend's jobs need to run. On pull requests the
  # remaining jobs are skipped when nothing relevant changed — skipped checks
  # are reported and count as passing, which a path-filtered trigger cannot do.
  changes:
    name: Changes (karukan-macos)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - 'karukan-im/macos/**'
              - 'karukan-im/core/**'
              - 'karukan-engine/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/karukan-macos-ci.yml'

  lint:
    name: Swift Format
    runs-on: macos-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Install swift-format
        run: brew install swift-format
      - name: Swift format lint
        run: swift-format lint -r Sources/ Tests/
        working-directory: karukan-im/macos

  test:
    name: Build & Test
    runs-on: macos-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # Rust-side coverage on macOS (karukan-imserver is the macOS engine path)
      - name: Run Rust tests (karukan-im)
        run: cargo test -p karukan-im

      # target/debug/karukan-imserver is required by the Swift
      # TransportTests (they skip when the binary is missing)
      - name: Build karukan-imserver
        run: cargo build -p karukan-im --bin karukan-imserver

      - name: Swift build
        run: swift build
        working-directory: karukan-im/macos

      - name: Swift test
        run: swift test
        working-directory: karukan-im/macos
