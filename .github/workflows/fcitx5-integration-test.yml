name: fcitx5 Integration Test

on:
  push:
    branches: [main]
    paths:
      - 'karukan-im/fcitx5/**'
      - 'karukan-im/core/**'
      - 'karukan-engine/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tests/integration/**'
      - '.github/workflows/fcitx5-integration-test.yml'
  # No `paths` filter here on purpose: a workflow skipped by path filtering
  # never creates its check runs, so required status checks stay stuck on
  # "Expected — Waiting for status to be reported" and block the merge. The
  # same paths live in the `changes` job below instead — a job skipped by
  # `if:` *does* report, and a skipped check satisfies a required check.
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether the integration test needs to run. On pull requests it is
  # skipped when nothing relevant changed — skipped checks are reported and
  # count as passing, which a path-filtered trigger cannot do.
  changes:
    name: Changes (fcitx5 integration)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - 'karukan-im/fcitx5/**'
              - 'karukan-im/core/**'
              - 'karukan-engine/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'tests/integration/**'
              - '.github/workflows/fcitx5-integration-test.yml'

  fcitx5-integration:
    name: fcitx5 Addon Integration Test
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      # Layer caching is what keeps this job short. Without it every run
      # re-downloads the apt dependencies (once an hour's worth) and rebuilds
      # every Rust dependency from scratch. `mode=max` is required: the default
      # `min` only stores the final stage, which would leave the apt layer and
      # the cargo-chef cook layer -- the two expensive ones -- uncached.
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tests/integration/Dockerfile.fcitx5
          tags: karukan-fcitx5-test
          load: true
          build-args: |
            APT_MIRROR=http://azure.archive.ubuntu.com/ubuntu
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run integration tests
        run: docker run --rm karukan-fcitx5-test
