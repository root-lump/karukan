name: karukan-engine CI

on:
  push:
    branches: [main]
    paths:
      - 'karukan-engine/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/karukan-engine-ci.yml'
  # No `paths` filter here on purpose: a workflow skipped by path filtering
  # never creates its check runs, so required status checks stay stuck on
  # "Expected — Waiting for status to be reported" and block the merge. The
  # same paths live in the `changes` job below instead — a job skipped by
  # `if:` *does* report, and a skipped check satisfies a required check.
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_integration_tests:
        description: 'Run integration tests (requires model download)'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Decides whether this crate's jobs need to run. On pull requests the
  # remaining jobs are skipped when nothing relevant changed — skipped checks
  # are reported and count as passing, which a path-filtered trigger cannot do.
  changes:
    name: Changes (karukan-engine)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - 'karukan-engine/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/karukan-engine-ci.yml'

  check:
    name: Check
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Run cargo check
        run: cargo check -p karukan-engine --all-targets

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Run cargo clippy
        run: cargo clippy -p karukan-engine --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Run cargo fmt
        run: cargo fmt -p karukan-engine -- --check

  # Deliberately one job per OS instead of a matrix. A matrix job skipped by
  # `if:` never expands its matrix, so it reports a single check under the
  # *unexpanded* name `Test (${{ matrix.os }})`. The required checks
  # `Test (ubuntu-latest)` / `Test (macos-latest)` would then never be
  # reported and the PR would block forever. Literal names always report,
  # whether the job runs or is skipped.
  #
  # Separate jobs also preserve the old `fail-fast: false` behaviour: one OS
  # failing does not cancel the other.
  test-ubuntu:
    name: Test (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Run unit tests
        run: cargo test -p karukan-engine --lib --bins

  test-macos:
    name: Test (macos-latest)
    runs-on: macos-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Run unit tests
        run: cargo test -p karukan-engine --lib --bins

  integration-test:
    name: Integration Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_integration_tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Cache HuggingFace models
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-models-v1
      - name: Run integration tests
        run: cargo test -p karukan-engine --test kanji_conversion_tests -- --ignored
        timeout-minutes: 30

  # Same reason as the test jobs above: literal names so a skipped job still
  # reports under a stable check name. Not required today, but keeping the
  # shape consistent means adding these to the ruleset later cannot reintroduce
  # the deadlock.
  build-ubuntu:
    name: Build Release (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Build release
        run: cargo build -p karukan-engine --release

  build-macos:
    name: Build Release (macos-latest)
    runs-on: macos-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Build release
        run: cargo build -p karukan-engine --release
